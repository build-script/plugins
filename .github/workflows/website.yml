# xkit-build/website shows the docs of these plugins: after every push to main it deploys again. The plugins are
# built by the scenarios of xkit-build/regressions, this repository has no build of its own. The token is a
# fine-grained one with Contents read and write on xkit-build/website only; without it the site catches up with
# its daily deploy.
name: website

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  website:
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy of xkit-build/website
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::no secret WEBSITE_DISPATCH_TOKEN, the site deploys with its daily build"
            exit 0
          fi
          gh api repos/xkit-build/website/dispatches -f event_type=plugins -f "client_payload[commit]=$GITHUB_SHA"
